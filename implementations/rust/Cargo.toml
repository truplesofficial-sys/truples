[package]
name = "truples-crypto-rust"
version = "1.0.0"
edition = "2021"
description = "Independent Rust Conformance Implementation for Truples Enterprise Double Ratchet Protocol"
license = "Proprietary"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
