name: Truples Protocol Security & Formal Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-verification:
    name: Mandatory 4-Tier Zero-Fallback Protocol Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain & Cargo
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Setup Tamarin Prover & Compatible Maude 3.5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz wget unzip
          wget -q https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          unzip -q Maude-3.5.1-linux-x86_64.zip -d maude_extracted
          find maude_extracted -type f -name "*maude*" -exec sudo cp {} /usr/local/bin/maude \;
          sudo chmod +x /usr/local/bin/maude
          wget -q https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          tar -xzf tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          sudo mv tamarin-prover /usr/local/bin/
          sudo chmod +x /usr/local/bin/tamarin-prover
          maude --version
          tamarin-prover --version

      - name: Execute 1:1 Model-Implementation Correspondence Check
        run: node scripts/check_correspondence.js

      - name: Execute Adversarial & Combined Tamper Penetration Tests
        run: |
          node tests/adversarial/malicious_server.test.js
          node tests/adversarial/combined_tamper.test.js

      - name: Execute Crash Resilience & CAS Concurrency Tests
        run: |
          node tests/crash/crash_recovery.test.js
          node tests/crash/concurrent_snapshot.test.js

      - name: Run 28 Enterprise Cryptographic Integration Suite
        run: node tests/crypto.test.js

      - name: Execute Independent Rust Conformance Suite
        run: |
          cd implementations/rust
          cargo run

      - name: Execute Machine-Checked Tamarin Formal Verification (4/4 Security Lemmas)
        run: tamarin-prover formal/truples_ratchet.spthy --prove
